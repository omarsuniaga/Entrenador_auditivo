name: Cloudflare preflight and deploy

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has_deploy_token: ${{ steps.token_check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preflight:cloudflare:local
      # Referencing `secrets` directly in a job-level `if:` (as the deploy job below
      # would otherwise need to) makes GitHub reject the whole workflow at startup
      # before any job runs — confirmed by bisection on 2026-08-17. Computing presence
      # here, inside a step, and exposing it as a plain string output sidesteps that.
      - id: token_check
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: preflight
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.preflight.outputs.has_deploy_token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate provisioned Cloudflare configuration
        run: npm run validate:cloudflare-config
      - name: Apply D1 migrations remotely
        run: npx wrangler d1 migrations apply entrenador-auditivo --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke deployed API
        run: npm run smoke:cloudflare:deployment
        env:
          CLOUDFLARE_SMOKE_URL: ${{ vars.CLOUDFLARE_SMOKE_URL }}
